name: Sugestão de melhoria
description: Proponha uma melhoria com valor claro para quem usa a Lauda
title: "[Feature] "
labels: ["type:feature", "status:needs-triage"]
body:
  - type: textarea
    attributes:
      label: Problema
      description: Quem enfrenta que problema, e em que situação?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Resultado proposto
      description: Descreva o resultado esperado, sem precisar definir antes a arquitetura interna.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternativas e limites
      description: O que você já tentou? A mudança afeta dados, privacidade, compatibilidade ou implantação?
