name: Relato de bug
description: Informe um problema reproduzível no produto ou no código
title: "[Bug] "
labels: ["type:bug", "status:needs-triage"]
body:
  - type: textarea
    attributes:
      label: Descrição do problema
      description: O que aconteceu e o que você esperava?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Passos para reproduzir
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: input
    attributes:
      label: Versão e modo de execução
      placeholder: "v0.2.0 / launcher do Windows / núcleo local no navegador / Docker"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs ou capturas de tela
      description: Antes de enviar, remova o texto da obra, chaves, cookies e endereços privados.
